<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>保険募集同意書 オンライン署名</title>
<script defer src="vendor/pdf-lib.min.js"></script>
<style>
  :root{ --brand:#1f6f54; --brand-d:#16513d; --line:#d8ddd9; --bg:#f4f6f5;
    --ink:#222; --muted:#667; --warn:#c0392b; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.7;}
  header{background:var(--brand);color:#fff;padding:14px 16px;text-align:center;}
  header h1{margin:0;font-size:17px;font-weight:600;}
  header p{margin:4px 0 0;font-size:12px;opacity:.85;}
  main{max-width:760px;margin:0 auto;padding:16px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .pdf-area{background:#e9ece9;border:1px solid var(--line);border-radius:10px;
    padding:10px;text-align:center;overflow:auto;max-height:62vh;}
  #docImg{width:100%;max-width:680px;box-shadow:0 2px 8px rgba(0,0,0,.12);background:#fff;display:block;margin:0 auto;}
  .loading{padding:40px;color:var(--muted);font-size:14px;}
  .field{margin-bottom:16px;}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  label .req{color:var(--warn);font-size:11px;margin-left:6px;}
  input[type=text]{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);
    border-radius:8px;background:#fff;}
  input[type=text]:focus{outline:none;border-color:var(--brand);}
  .sig-wrap{position:relative;border:2px dashed var(--line);border-radius:10px;
    background:#fafbfa;overflow:hidden;}
  .sig-wrap.filled{border-style:solid;border-color:var(--brand);}
  #sigCanvas{display:block;width:100%;height:190px;touch-action:none;cursor:crosshair;}
  .sig-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#b7c0ba;font-size:14px;pointer-events:none;}
  .sig-bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .sig-bar small{color:var(--muted);font-size:12px;}
  /* 手書き日付 */
  .date-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
  .date-cell{flex:1;min-width:90px;}
  .date-cell .dlab{font-size:12px;color:var(--muted);margin-bottom:4px;display:block;font-weight:600;}
  .pad-wrap{position:relative;display:flex;align-items:center;gap:6px;}
  .pad-wrap .kanji{font-size:16px;font-weight:600;}
  .pad{position:relative;flex:1;border:2px dashed var(--line);border-radius:8px;background:#fafbfa;overflow:hidden;}
  .pad.filled{border-style:solid;border-color:var(--brand);}
  .pad canvas{display:block;width:100%;height:64px;touch-action:none;cursor:crosshair;}
  .pad .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cdd4cf;font-size:13px;pointer-events:none;}
  .btn{appearance:none;border:none;border-radius:8px;font-size:15px;font-weight:600;
    padding:12px 18px;cursor:pointer;transition:.15s;}
  .btn-clear{background:#eee;color:#555;padding:8px 14px;font-size:13px;}
  .btn-clear:active{background:#ddd;}
  .btn-primary{background:var(--brand);color:#fff;width:100%;padding:16px;font-size:16px;}
  .btn-primary:active{background:var(--brand-d);}
  .btn-primary:disabled{background:#bcc7c1;cursor:not-allowed;}
  .agree{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin-bottom:16px;
    background:#f0f6f3;padding:12px;border-radius:8px;}
  .agree input{width:20px;height:20px;margin-top:2px;flex:none;}
  .meta{font-size:12px;color:var(--muted);margin-top:6px;}
  .done{text-align:center;padding:24px;}
  .done .check{width:64px;height:64px;border-radius:50%;background:var(--brand);color:#fff;
    font-size:34px;line-height:64px;margin:0 auto 12px;}
  .done h2{margin:0 0 6px;color:var(--brand-d);}
  .done .dl{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
  .hidden{display:none;}
  .footnote{font-size:11px;color:#999;text-align:center;margin-top:24px;}
  .errbox{background:#fdecea;color:#a32b20;border:1px solid #f5c6c0;border-radius:8px;
    padding:12px;font-size:13px;margin-bottom:16px;}
</style>
</head>
<body>
<header>
  <h1>保険募集同意書</h1>
  <p>オンライン署名フォーム（試作版）</p>
</header>

<main>
  <div id="formView">
    <div id="errArea"></div>
    <div id="dbg" style="font-size:11px;color:#666;background:#eef1ef;border:1px solid #dde;border-radius:6px;padding:6px 8px;margin-bottom:10px;">診断: 起動待ち…</div>

    <div class="card">
      <label style="margin-bottom:10px;">同意書の内容（全文）<span style="font-weight:400;color:var(--muted);font-size:12px;margin-left:6px;">下までスクロールしてご確認ください</span></label>
      <div class="pdf-area">
        <div class="loading" id="pdfLoading">同意書を読み込んでいます…</div>
        <img id="docImg" src="document.png" alt="保険募集同意書" style="display:none;"
             onload="document.getElementById('pdfLoading').style.display='none'; this.style.display='block';"
             onerror="document.getElementById('pdfLoading').textContent='画像の読み込みに失敗しました';">
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label>お名前（フルネーム）<span class="req">必須</span></label>
        <input type="text" id="nameInput" placeholder="例）山田 太郎" autocomplete="name">
      </div>

      <div class="field">
        <label>日付（手書き）<span class="req">必須</span>
          <button class="btn btn-clear" id="todayBtn" type="button" style="float:right;font-weight:600;">今日の日付を見る</button>
        </label>
        <div class="date-row">
          <div class="date-cell"><span class="dlab" id="lblY">年（西暦）</span>
            <div class="pad-wrap"><div class="pad" data-k="year"><canvas></canvas><div class="ph">年</div></div><span class="kanji">年</span></div>
          </div>
          <div class="date-cell"><span class="dlab">月</span>
            <div class="pad-wrap"><div class="pad" data-k="month"><canvas></canvas><div class="ph">月</div></div><span class="kanji">月</span></div>
          </div>
          <div class="date-cell"><span class="dlab">日</span>
            <div class="pad-wrap"><div class="pad" data-k="day"><canvas></canvas><div class="ph">日</div></div><span class="kanji">日</span></div>
          </div>
        </div>
        <div class="sig-bar"><small>各枠に数字を手書きしてください（例：2026 / 6 / 2）</small>
          <button class="btn btn-clear" id="clearDateBtn" type="button">日付を書き直す</button></div>
      </div>

      <div class="field">
        <label>ご署名<span class="req">必須</span></label>
        <div class="sig-wrap" id="sigWrap">
          <canvas id="sigCanvas"></canvas>
          <div class="sig-hint" id="sigHint">こちらに指またはペンで署名してください</div>
        </div>
        <div class="sig-bar">
          <small>スマホ・タブレットは指やペン、PCはマウスで書けます</small>
          <button class="btn btn-clear" id="clearBtn" type="button">書き直す</button>
        </div>
      </div>

      <div class="agree">
        <input type="checkbox" id="agreeChk">
        <label for="agreeChk" style="font-weight:400;margin:0;">上記「保険募集同意書」の内容について説明を受け、理解した上で、同意します。</label>
      </div>

      <button class="btn btn-primary" id="submitBtn" type="button" disabled>同意して署名を確定する</button>
      <p class="meta" id="metaInfo"></p>
    </div>
  </div>

  <div id="doneView" class="hidden">
    <div class="card done">
      <div class="check">✓</div>
      <h2 id="doneHead">署名が完了しました</h2>
      <p id="doneSub">署名と日付を反映した同意書（PDF）を保存できます。</p>
      <div class="dl">
        <button class="btn btn-primary" id="pdfBtn" type="button">控え（PDF）を保存する</button>
        <button class="btn btn-clear" id="againBtn" type="button" style="padding:14px;font-size:15px;">最初からやり直す</button>
      </div>
      <p class="meta" id="recordInfo"></p>
    </div>
  </div>

  <p class="footnote">承諾書署名アプリ 試作版 v0.4（オフライン同梱版・手書き日付）</p>
</main>

<script>
function dbg(s){ var e=document.getElementById('dbg'); if(e){ e.textContent='診断: '+s; } }
window.addEventListener('error', function(ev){ dbg('エラー → '+ev.message+' (行'+ev.lineno+')'); });
dbg('起動中…(スクリプト開始)');
const PDF_URL = "document.pdf";
const DOC_VERSION = "hoken-boshu-doui-v1";
const DOC_TITLE = "保険募集同意書";

// ===== Supabase 設定（プロジェクト作成後にここへ貼り付け）=====
// 空のままなら自動アップロードは行わず、従来どおりダウンロードのみ動作します（安全）。
const SUPABASE_URL = "";        // 例: https://xxxxxxxx.supabase.co
const SUPABASE_ANON_KEY = "";   // 例: eyJhbGciOi... （anon public キー）
const SUPABASE_BUCKET = "signed-consents";
const supaEnabled = !!(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase);
const supa = supaEnabled ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

// 署名済みPDFをクラウド保管庫へアップロード（お客様は送り返し不要）
async function uploadSigned(bytes, rec){
  if(!supaEnabled) return { ok:false, skipped:true };
  const safeName = (rec.name || "署名者").replace(/[\\/:*?"<>|␀-]/g,"_").slice(0,40);
  const d = new Date(rec.signedAt);
  const ts = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${String(d.getSeconds()).padStart(2,'0')}`;
  const path = `signed/${ts}_${safeName}.pdf`;
  const { error } = await supa.storage.from(SUPABASE_BUCKET)
    .upload(path, new Blob([bytes],{type:'application/pdf'}), { contentType:'application/pdf', upsert:false });
  if(error) return { ok:false, error: error.message };
  return { ok:true, path };
}

// 実測座標（PyMuPDF・原点は左上/y下向き、ページ高さ841.92pt）。pdf-libは左下原点なので y=PAGE_H-yTop で変換
const PAGE_H = 841.92;
const SIG_BOX  = { x: 85, yTop: 681, w: 210, h: 46 };          // 「ご署名:」の右
const DATE_LINE_TOP = 646;                                      // 「年 月 日」の下端
const DATE_PADS = {                                             // 各数字の右端を漢字の直前に合わせる
  year:  { rightX: 104, maxW: 30, maxH: 22 },
  month: { rightX: 153, maxW: 33, maxH: 22 },
  day:   { rightX: 204, maxW: 33, maxH: 22 }
};

let pdfBytes = null, signedPdfBytes = null, lastRecord = null;

// --- 署名埋め込み用に元PDFのデータだけ取得（表示は document.png の<img>が担当）---
(async function loadPdfBytes(){
  try{
    const resp = await fetch(PDF_URL);
    if(!resp.ok) throw new Error("PDFの取得に失敗しました ("+resp.status+")");
    pdfBytes = await resp.arrayBuffer();
    refresh();
  }catch(e){
    showError("同意書PDFを取得できませんでした。"+e.message);
  }
})();
function showError(msg){ document.getElementById('errArea').innerHTML = `<div class="errbox">${msg}</div>`; }

// ============ 手書きパッド共通 ============
function makePad(canvas, onFirstInk){
  const ctx = canvas.getContext('2d');
  let drawing=false, hasInk=false;
  function setup(){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width*dpr; canvas.height = rect.height*dpr;
    ctx.scale(dpr,dpr); ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#13294b';
  }
  setup();
  // 指・Apple Pencil は touch、PCは mouse で扱う（iOS Safari で最も確実な方式）
  function pos(e){ const r=canvas.getBoundingClientRect();
    const t=(e.touches&&e.touches[0])?e.touches[0]:(e.changedTouches&&e.changedTouches[0])?e.changedTouches[0]:e;
    return {x:t.clientX-r.left, y:t.clientY-r.top}; }
  function start(e){ if(e.cancelable) e.preventDefault(); drawing=true;
    dbg('タッチ検知 ✓'); const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y);
    // 点置き（タップだけでも線が出るように）
    ctx.lineTo(p.x+0.1,p.y+0.1); ctx.stroke();
    if(!hasInk){ hasInk=true; dbg('描画OK ✓'); if(onFirstInk) onFirstInk(); } }
  function move(e){ if(!drawing)return; if(e.cancelable) e.preventDefault(); const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke();
    if(!hasInk){ hasInk=true; dbg('描画OK ✓'); if(onFirstInk) onFirstInk(); } }
  function end(){ drawing=false; }
  canvas.style.touchAction='none';
  // タッチ（iPhone/iPad/Android・Apple Pencil）。passive:false + preventDefault でスクロールを抑止し描画
  canvas.addEventListener('touchstart',start,{passive:false});
  canvas.addEventListener('touchmove',move,{passive:false});
  canvas.addEventListener('touchend',end);
  canvas.addEventListener('touchcancel',end);
  // マウス（PC）。touchstartのpreventDefaultで合成マウスは抑止される
  canvas.addEventListener('mousedown',start);
  canvas.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
  return {
    get hasInk(){ return hasInk; },
    clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); hasInk=false; },
    // 余白を切り取ったPNGと縦横比を返す
    trimmed(){
      const w=canvas.width,h=canvas.height,d=ctx.getImageData(0,0,w,h).data;
      let minX=w,minY=h,maxX=0,maxY=0,f=false;
      for(let y=0;y<h;y++)for(let x=0;x<w;x++){ if(d[(y*w+x)*4+3]!==0){f=true;
        if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;} }
      if(!f) return null;
      const pad=6; minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(w,maxX+pad);maxY=Math.min(h,maxY+pad);
      const tw=maxX-minX,th=maxY-minY,tc=document.createElement('canvas'); tc.width=tw;tc.height=th;
      tc.getContext('2d').drawImage(canvas,minX,minY,tw,th,0,0,tw,th);
      return {url:tc.toDataURL('image/png'), ratio:tw/th};
    }
  };
}

// --- 署名パッド ---
const sigWrap=document.getElementById('sigWrap'), sigHint=document.getElementById('sigHint');
const sigPad = makePad(document.getElementById('sigCanvas'), ()=>{ sigHint.style.display='none'; sigWrap.classList.add('filled'); refresh(); });
document.getElementById('clearBtn').addEventListener('click',()=>{ sigPad.clear(); sigHint.style.display='flex'; sigWrap.classList.remove('filled'); refresh(); });

// --- 日付パッド3つ ---
const datePads = {};
document.querySelectorAll('.pad').forEach(div=>{
  const k=div.dataset.k, cv=div.querySelector('canvas'), ph=div.querySelector('.ph');
  datePads[k]=makePad(cv, ()=>{ ph.style.display='none'; div.classList.add('filled'); refresh(); });
  datePads[k]._div=div; datePads[k]._ph=ph;
});
function clearAllDates(){ Object.values(datePads).forEach(p=>{ p.clear(); p._ph.style.display='flex'; p._div.classList.remove('filled'); }); refresh(); }
document.getElementById('clearDateBtn').addEventListener('click',clearAllDates);

// 今日の日付を参考表示
document.getElementById('todayBtn').addEventListener('click',()=>{
  const n=new Date();
  alert(`今日の日付は ${n.getFullYear()}年 ${n.getMonth()+1}月 ${n.getDate()}日 です。\n各枠に数字を手書きしてください。`);
});

// --- 入力チェック ---
const nameInput=document.getElementById('nameInput'), agreeChk=document.getElementById('agreeChk'), submitBtn=document.getElementById('submitBtn');
[nameInput,agreeChk].forEach(el=>el.addEventListener('input',refresh));
function datesFilled(){ return datePads.year.hasInk && datePads.month.hasInk && datePads.day.hasInk; }
function refresh(){ submitBtn.disabled = !(nameInput.value.trim() && sigPad.hasInk && datesFilled() && agreeChk.checked && pdfBytes); }

// --- 署名確定 → 元PDFに署名・手書き日付を埋め込み ---
document.getElementById('submitBtn').addEventListener('click',async()=>{
  try{
    submitBtn.disabled=true; submitBtn.textContent='処理中…';
    if(typeof PDFLib==='undefined'){ submitBtn.disabled=false; submitBtn.textContent='同意して署名を確定する';
      showError('準備中です。数秒おいてから、もう一度「確定」を押してください。'); return; }
    const now=new Date();
    const { PDFDocument } = PDFLib;
    const pdfDoc = await PDFDocument.load(pdfBytes.slice(0));
    const page = pdfDoc.getPages()[0];

    // 署名画像
    const sig = sigPad.trimmed();
    const png = await pdfDoc.embedPng(sig.url);
    let sh=SIG_BOX.h, sw=sh*sig.ratio; if(sw>SIG_BOX.w){ sw=SIG_BOX.w; sh=sw/sig.ratio; }
    page.drawImage(png,{ x:SIG_BOX.x, y:PAGE_H-SIG_BOX.yTop, width:sw, height:sh });

    // 手書き日付3つ（右端を漢字の直前に合わせる）
    for(const k of ['year','month','day']){
      const t = datePads[k].trimmed(); if(!t) continue;
      const cfg = DATE_PADS[k];
      let h=cfg.maxH, w=h*t.ratio; if(w>cfg.maxW){ w=cfg.maxW; h=w/t.ratio; }
      const img = await pdfDoc.embedPng(t.url);
      page.drawImage(img,{ x:cfg.rightX-w, y:PAGE_H-DATE_LINE_TOP, width:w, height:h });
    }

    signedPdfBytes = await pdfDoc.save();

    const stamp = now.toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
    lastRecord = { name:nameInput.value.trim(), signedAt:now.toISOString(), signedAtLocal:stamp, docVersion:DOC_VERSION };
    saveRecord(lastRecord);

    // クラウド保管庫へ自動アップロード（設定済みの場合）
    let up = { ok:false, skipped:true };
    if(supaEnabled){
      submitBtn.textContent='送信中…';
      up = await uploadSigned(signedPdfBytes, lastRecord);
    }

    const head = document.getElementById('doneHead');
    const sub  = document.getElementById('doneSub');
    if(up.ok){
      head.textContent='送信が完了しました';
      sub.textContent='署名済みの同意書を担当者へお送りしました。これで完了です（送り返す必要はありません）。';
    }else if(up.skipped){
      head.textContent='署名が完了しました';
      sub.textContent='署名と日付を反映した同意書（PDF）を保存できます。';
    }else{
      head.textContent='署名は完了しました（送信のみ未完了）';
      sub.textContent='通信エラーで自動送信ができませんでした。お手数ですが下のボタンでPDFを保存し、担当者へお送りください。';
      showError('自動送信に失敗しました：'+(up.error||'不明なエラー'));
    }

    document.getElementById('formView').classList.add('hidden');
    document.getElementById('doneView').classList.remove('hidden');
    document.getElementById('recordInfo').textContent =
      `署名者：${lastRecord.name}／受付日時：${stamp}／文面：${DOC_VERSION}`;
    window.scrollTo(0,0);
  }catch(e){
    submitBtn.disabled=false; submitBtn.textContent='同意して署名を確定する';
    showError("署名の埋め込みに失敗しました。"+e.message); window.scrollTo(0,0);
  }
});

function saveRecord(rec){ try{ const k='consentRecords'; const a=JSON.parse(localStorage.getItem(k)||'[]'); a.push(rec); localStorage.setItem(k,JSON.stringify(a)); }catch(e){ console.warn(e); } }

document.getElementById('pdfBtn').addEventListener('click',()=>{
  if(!signedPdfBytes) return;
  const blob=new Blob([signedPdfBytes],{type:'application/pdf'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`保険募集同意書_${lastRecord.name}_${dateTag()}.pdf`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
});
function dateTag(){const d=new Date();return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;}

document.getElementById('againBtn').addEventListener('click',()=>{
  nameInput.value=''; agreeChk.checked=false;
  sigPad.clear(); sigHint.style.display='flex'; sigWrap.classList.remove('filled');
  clearAllDates(); signedPdfBytes=null; refresh();
  document.getElementById('doneView').classList.add('hidden');
  document.getElementById('formView').classList.remove('hidden');
  window.scrollTo(0,0);
});

document.getElementById('metaInfo').textContent = `文面バージョン：${DOC_VERSION}`;
dbg(`準備OK（入力方式: ${window.PointerEvent ? 'Pointer' : 'Touch'}／端末: ${navigator.maxTouchPoints||0}点タッチ）`);
</script>
</body>
</html>
